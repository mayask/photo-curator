[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "photo-book-curator"
version = "0.2.1"
description = "Local-first, read-only photo library analyzer and photo-book collection curator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "smbprotocol>=1.17,<2",
  "Pillow>=10.4,<13",
  "pillow-heif>=0.18,<2",
  "ImageHash>=4.3,<5",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "scikit-learn>=1.5,<2",
  "reverse-geocoder>=1.5,<2",
  "holidays>=0.58,<1",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
